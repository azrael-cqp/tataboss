<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Antrenament</title>

  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%230f172a'/%3E%3Ctext x='50%25' y='60%25' font-size='95' text-anchor='middle' fill='%23a78bfa' font-family='sans-serif' font-weight='bold'%3E%F0%9F%8F%8B%3C/text%3E%3C/svg%3E" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230f172a'/%3E%3Ctext x='50%25' y='62%25' font-size='18' text-anchor='middle'%3E%F0%9F%8F%8B%3C/text%3E%3C/svg%3E" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root {
      height: 100%; width: 100%;
      background: #0f172a; color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      overflow-x: hidden;
    }
    input, textarea, button { font-size: 18px; }
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0f172a; color: #a78bfa;
      gap: 20px; z-index: 9999;
    }
    #loading.hidden { display: none; }
    .pulse {
      width: 66px; height: 66px;
      border: 4px solid #1e293b; border-top-color: #a78bfa;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .label { font-size: 20px; letter-spacing: 2px; color: #94a3b8; font-weight: 700; }
    #error-display {
      position: fixed; inset: 0; display: none;
      flex-direction: column; padding: 20px;
      background: #0f172a; color: #fca5a5;
      font-family: monospace; font-size: 14px;
      z-index: 9999; overflow: auto;
    }
    #error-display.shown { display: flex; }
    #error-display h2 { color: #ef4444; margin-bottom: 14px; font-size: 20px; }
    #error-display pre {
      white-space: pre-wrap; word-break: break-all;
      background: rgba(0,0,0,.5); padding: 12px;
      border-radius: 8px; border: 1px solid rgba(239,68,68,.3);
      max-height: 60vh; overflow: auto;
    }
    #error-display button {
      margin-top: 16px; padding: 16px;
      background: rgba(168,85,247,.2);
      border: 2px solid rgba(168,85,247,.5);
      border-radius: 10px; color: #c4b5fd;
      font-size: 18px; font-weight: 800;
      cursor: pointer; font-family: inherit;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="pulse"></div>
    <div class="label">SE INCARCA...</div>
  </div>

  <div id="error-display">
    <h2>APLICATIA S-A OPRIT</h2>
    <pre id="error-message"></pre>
    <button onclick="location.reload()">REINCARCA</button>
  </div>

  <div id="root"></div>

  <script>
    var errorShown = false;
    function showError(msg) {
      if (errorShown) return;
      errorShown = true;
      var errorEl = document.getElementById('error-display');
      var errorMsg = document.getElementById('error-message');
      var loadingEl = document.getElementById('loading');
      if (errorEl && errorMsg) {
        errorMsg.textContent = msg;
        errorEl.classList.add('shown');
      }
      if (loadingEl) loadingEl.classList.add('hidden');
    }
    window.addEventListener('error', function(e) {
      var msg = (e.message || 'Eroare de script') + '\n\n';
      msg += 'Fisier: ' + (e.filename || 'necunoscut') + '\n';
      msg += 'Linia: ' + (e.lineno || '?') + ', Col: ' + (e.colno || '?') + '\n\n';
      if (e.error && e.error.stack) msg += e.error.stack;
      showError(msg);
    });
    window.addEventListener('unhandledrejection', function(e) {
      var msg = 'Promisiune respinsa:\n';
      if (e.reason) {
        msg += (e.reason.message || e.reason) + '\n';
        if (e.reason.stack) msg += '\n' + e.reason.stack;
      }
      showError(msg);
    });
  </script>

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <!-- JS pre-compilat - fara Babel -->
  <script src="app.compiled.js"></script>

  <script>
    (function() {
      function mount() {
        if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') { setTimeout(mount, 50); return; }
        if (typeof App === 'undefined') { setTimeout(mount, 50); return; }
        try {
          var root = ReactDOM.createRoot(document.getElementById('root'));
          root.render(React.createElement(App));
          var loader = document.getElementById('loading');
          if (loader) loader.classList.add('hidden');
        } catch (err) {
          showError('Eroare la pornire:\n' + (err.message || err) + '\n\n' + (err.stack || ''));
        }
      }
      mount();
    })();
  </script>
</body>
</html>
